name: Publish

# Publishes the extension to the VS Code Marketplace when a version tag is
# pushed. Authentication is Marketplace Trusted Publishing: the job's GitHub
# OIDC token is exchanged for a Marketplace credential that lasts 15 minutes,
# so no Personal Access Token is stored. It needs the Trusted Publishing policy
# on the Lecstor publisher described in CONTRIBUTING.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token vsce exchanges with the Marketplace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "VSIX=makespdf-vscode-plugin-${version}.vsix" >> "$GITHUB_ENV"

      - run: npm run typecheck
      - run: npm test

      # vscode:prepublish runs the build.
      - run: npm run package

      - run: npx vsce publish --oidc --packagePath "$VSIX"

      # The published file, for publishing the same build elsewhere by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ env.VSIX }}
